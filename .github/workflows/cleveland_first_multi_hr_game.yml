name: Cleveland First Multi-HR Game

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: |
          python cleveland_first_multi_hr_game.py

      - name: Show output files
        run: |
          ls -lah

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-first-multi-hr-game
          path: cleveland_first_multi_hr_game.csv
