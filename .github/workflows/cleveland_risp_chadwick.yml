name: Cleveland RISP (Chadwick)

on:
  workflow_dispatch:

jobs:
  run-search:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            git
      
      - name: Build Chadwick
        run: |
          git clone https://github.com/chadwickbureau/chadwick.git
          cd chadwick
          autoreconf -i
          ./configure
          make
          sudo make install
          sudo ldconfig
      
      - name: Verify Chadwick
        run: |
          which cwevent
          cwevent -h

      - name: Verify Chadwick
        run: |
          which cwevent
          cwevent -h

      - name: Run Cleveland RISP Chadwick search
        run: |
          python cleveland_risp_chadwick.py
