name: Cleveland RISP Spans

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Chadwick
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

          git clone https://github.com/chadwickbureau/chadwick.git
          cd chadwick

          autoreconf -i
          ./configure
          make
          sudo make install

      - name: Verify Chadwick installation
        run: |
          cwevent -h

      - name: Run script
        run: |
          python cleveland_risp_spans.py
