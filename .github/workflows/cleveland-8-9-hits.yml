name: Cleveland 8-9 Hit Games

on:
  workflow_dispatch:

jobs:
  search:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run search
        run: python cleveland_8_9_hits.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-8-9-hits
          path: cleveland_8_9_hits.csv
