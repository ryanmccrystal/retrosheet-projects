name: Cleveland RISP Search

on:
  workflow_dispatch:

jobs:
  run-search:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cleveland RISP search
        run: |
          python cleveland_risp.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cleveland-risp-results
          path: |
            *.csv
            *.txt
